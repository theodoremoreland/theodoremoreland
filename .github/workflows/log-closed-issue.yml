name: Post Closed Issue Shared Workflow

on:
  workflow_call:
    secrets:
      api_endpoint:
        required: true
        description: "The API Gateway endpoint URL"
      api_key:
        required: true
        description: "The API Gateway API key"

jobs:
    post-issue:
      runs-on: ubuntu-latest
      steps:
        - name: Send Issue Data to API Gateway
          env:
            API_ENDPOINT: "${{ secrets.api_endpoint }}"
            API_KEY: "${{ secrets.api_key }}"
            ISSUE_ID: "${{ github.event.issue.id }}"
            PROJECT_ID: "${{ github.event.repository.id }}"
            CREATED_TIMESTAMP: "${{ github.event.issue.created_at }}"
            CLOSED_TIMESTAMP: "${{ github.event.issue.closed_at }}"
            STATUS: "${{ github.event.issue.state }}"
            LABELS_JSON: "${{ toJson(github.event.issue.labels) }}"
          run: |
            # Convert the labels array into a JSON list of label names using jq
            LABELS=$(echo "$LABELS_JSON" | jq '[.[].name]')
  
            # Construct the JSON payload safely via environment variables
            PAYLOAD=$(jq -n \
              --arg id "$ISSUE_ID" \
              --arg project_id "$PROJECT_ID" \
              --arg created_timestamp "$CREATED_TIMESTAMP" \
              --arg closed_timestamp "$CLOSED_TIMESTAMP" \
              --arg status "$STATUS" \
              --argjson labels "$LABELS" \
              '{
                id: $id,
                project_id: $project_id,
                created_timestamp: $created_timestamp,
                closed_timestamp: $closed_timestamp,
                status: $status,
                labels: $labels
              }')
  
            echo "Sending payload:"
            echo "$PAYLOAD"
  
            # Send the POST request to API Gateway
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$API_ENDPOINT" \
              -H "Content-Type: application/json" \
              -H "x-api-key: $API_KEY" \
              -d "$PAYLOAD")
  
            echo "API Gateway response status code: $RESPONSE"
  
            if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
              echo "Successfully posted closed issue data."
            else
              echo "Error: API returned status code $RESPONSE"
              exit 1
            fi
